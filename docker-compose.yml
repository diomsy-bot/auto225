# Déploiement sur un serveur (VPS) : application + PostgreSQL + proxy HTTPS (Caddy)
# + volumes persistants. Voir docs/DEPLOIEMENT.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto225
      POSTGRES_USER: auto225
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://auto225:${POSTGRES_PASSWORD}@db:5432/auto225
      STORAGE_DIR: /data/storage
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - storage:/data/storage
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-auto225.com}
      ACME_EMAIL: ${ACME_EMAIL:-contact@auto225.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
